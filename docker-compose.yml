services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - bkdata:/data
    expose:
      - "8787"
    ports:
      # Acces local au serveur uniquement (tunnel SSH : ssh -L 8787:127.0.0.1:8787 ...) ; pas ouvert sur Internet.
      - "127.0.0.1:8787:8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BK_DOMAIN=${BK_DOMAIN}
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bkdata:
  caddy_data:
  caddy_config:
